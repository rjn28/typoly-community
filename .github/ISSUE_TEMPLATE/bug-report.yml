name: Bug report
description: Something in Typoly does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to write this up. I read every bug report.

        **This page is public. Never paste private text, emails, names or account details.**
        If a correction went wrong, write a short made-up sentence that shows the same problem.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what Typoly did instead.
      placeholder: |
        I tapped my key in a Slack message. I expected the message to be corrected,
        but nothing happened and the text stayed selected.
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: App where it happened
      description: The app you were typing in, and the website if it was in a browser.
      placeholder: Slack, Chrome (gmail.com), Notes…
    validations:
      required: true
  - type: dropdown
    id: trigger
    attributes:
      label: How did you start the correction?
      options:
        - Tap on my correction key
        - Hold or double-tap (experimental)
        - Second shortcut
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: What was corrected?
      options:
        - The whole text field (nothing selected)
        - Only the part I selected
        - Not sure
  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Sometimes
        - Only once so far
    validations:
      required: true
  - type: input
    id: typoly-version
    attributes:
      label: Typoly version
      description: Settings → About.
      placeholder: "1.9.3"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 15.4, MacBook Air M2
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Diagnostic logs (optional)
      description: |
        Go to Settings → About → Export Logs… Open the file and check that you’re comfortable sharing the app names and other details it contains before attaching it here.
        The logs never contain the text you corrected.
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots or a short screen recording help a lot. Check that they show no private text.
