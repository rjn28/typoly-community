<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img"><title>New in Typoly 1.9: two modes, one key. Hold the key for one mode, double-tap it for the other, and swap them anytime.</title><foreignObject x="0" y="0" width="1280" height="380"><div xmlns="http://www.w3.org/1999/xhtml"><style>
*{box-sizing:border-box;margin:0;padding:0}
.page{width:1280px;height:380px;background:#08090d;color:#f6f6f7;font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif;
  padding:0 76px;display:flex;align-items:center;justify-content:space-between}
.eyebrow{font-size:14px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:#40a9ff;margin-bottom:18px}
.title{font-family:ui-serif, 'New York', 'Iowan Old Style', Georgia, 'Times New Roman', serif;font-size:64px;line-height:1.05;letter-spacing:-0.015em}
.sub{margin-top:20px;font-size:19px;color:#7c7c82}
.demo{display:flex;align-items:center;gap:44px}
.key{position:relative;width:112px;height:112px;border:2px solid #2a2b31;border-radius:22px;overflow:hidden}
.fill{position:absolute;left:0;right:0;bottom:0;height:0;background:#40a9ff}
.flash{position:absolute;inset:0;background:#40a9ff;opacity:0}
.glyph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:600;color:#7c7c82}
.side{display:flex;flex-direction:column;gap:16px}
.table{display:flex;align-items:center;gap:22px}
.rows{display:flex;flex-direction:column;gap:14px;min-width:330px}
.row{display:flex;justify-content:space-between;gap:40px;font-size:21px;padding-bottom:12px;border-bottom:1px solid #2a2b31;opacity:.35}
.row>span{color:#7c7c82}
.mode{display:inline-grid;justify-items:end}
.mode b{grid-area:1/1;font-weight:600;color:#f6f6f7}
.swap{color:#2a2b31}
.swap svg{display:block}
.note{font-size:15px;color:#7c7c82;padding-left:2px}
@keyframes fill{0.00%{height:0}4.00%{height:0}16.00%{height:100%}20.00%{height:0}50.00%{height:0}50.00%{height:0}54.00%{height:0}66.00%{height:100%}70.00%{height:0}100.00%{height:0}}.fill{animation:fill 14s ease-in infinite}@keyframes flash{0.00%{opacity:0}28.00%{opacity:0}28.75%{opacity:1}30.25%{opacity:1}31.00%{opacity:0}32.00%{opacity:0}32.75%{opacity:1}34.25%{opacity:1}35.00%{opacity:0}50.00%{opacity:0}50.00%{opacity:0}78.00%{opacity:0}78.75%{opacity:1}80.25%{opacity:1}81.00%{opacity:0}82.00%{opacity:0}82.75%{opacity:1}84.25%{opacity:1}85.00%{opacity:0}100.00%{opacity:0}}.flash{animation:flash 14s linear infinite}@keyframes glyph{0.00%{color:#7c7c82}10.00%{color:#7c7c82}12.00%{color:#08090d}19.00%{color:#08090d}21.00%{color:#7c7c82}28.50%{color:#7c7c82}28.75%{color:#08090d}34.25%{color:#08090d}35.00%{color:#7c7c82}50.00%{color:#7c7c82}50.00%{color:#7c7c82}60.00%{color:#7c7c82}62.00%{color:#08090d}69.00%{color:#08090d}71.00%{color:#7c7c82}78.50%{color:#7c7c82}78.75%{color:#08090d}84.25%{color:#08090d}85.00%{color:#7c7c82}100.00%{color:#7c7c82}}.glyph{animation:glyph 14s linear infinite}@keyframes r1{0.00%{opacity:.35}15.50%{opacity:.35}16.50%{opacity:1}25.00%{opacity:1}27.00%{opacity:.35}50.00%{opacity:.35}50.00%{opacity:.35}65.50%{opacity:.35}66.50%{opacity:1}75.00%{opacity:1}77.00%{opacity:.35}100.00%{opacity:.35}}.r1{animation:r1 14s ease-out infinite}@keyframes r2{0.00%{opacity:.35}34.00%{opacity:.35}35.00%{opacity:1}41.00%{opacity:1}43.00%{opacity:.35}50.00%{opacity:.35}50.00%{opacity:.35}84.00%{opacity:.35}85.00%{opacity:1}91.00%{opacity:1}93.00%{opacity:.35}100.00%{opacity:.35}}.r2{animation:r2 14s ease-out infinite}@keyframes swap{0%,40%{color:#2a2b31}43%,49%{color:#40a9ff}52%,90%{color:#2a2b31}93%,99%{color:#40a9ff}100%{color:#2a2b31}}.swap{animation:swap 14s ease-out infinite}@keyframes a{0%,45%{opacity:1;transform:none}47.5%,95%{opacity:0;transform:translateY(-8px)}97.5%,100%{opacity:1;transform:none}}.a{animation:a 14s ease-out infinite}@keyframes b{0%,45%{opacity:0;transform:translateY(8px)}47.5%,95%{opacity:1;transform:none}97.5%,100%{opacity:0;transform:translateY(8px)}}.b{animation:b 14s ease-out infinite}
@media (prefers-reduced-motion: reduce){
  .fill,.flash,.glyph,.r1,.r2,.a,.b,.swap{animation:none !important}
  .row{opacity:1} .b{opacity:0}
}
</style>
<div class="page">
  <div>
    <div class="eyebrow">New in Typoly 1.9</div>
    <div class="title">Two modes.<br/>One key.</div>
    <div class="sub">Hold it for one, double-tap it for the other.</div>
  </div>
  <div class="demo">
    <div class="key"><div class="fill"></div><div class="flash"></div><div class="glyph">⌘</div></div>
    <div class="side">
      <div class="table">
        <div class="rows">
          <div class="row r1"><span>Hold</span><span class="mode"><b class="a">Proofread</b><b class="b">Contextual</b></span></div>
          <div class="row r2"><span>Double-tap</span><span class="mode"><b class="a">Contextual</b><b class="b">Proofread</b></span></div>
        </div>
        <div class="swap"><svg xmlns="http://www.w3.org/2000/svg" width="26" height="62" viewBox="0 0 26 62" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 6v48M2 49l5 5 5-5"/><path d="M19 56V8M14 13l5-5 5 5"/></svg></div>
      </div>
      <div class="note">Swap the two modes anytime in Settings.</div>
    </div>
  </div>
</div></div></foreignObject></svg>
